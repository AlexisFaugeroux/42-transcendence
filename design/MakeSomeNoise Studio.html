<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MakeSomeNoise — Studio</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="design-system/colors_and_type.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg-app);
        color: var(--fg1);
        overflow: hidden;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      button {
        font: inherit;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--fg3);
      }
      select option {
        background: var(--bg-elevated);
        color: var(--fg1);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-void);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line-soft);
        border-radius: 5px;
        border: 2px solid var(--color-void);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--line-hover);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="icons.jsx"></script>
    <script type="text/babel" src="primitives.jsx"></script>
    <script type="text/babel" src="studio-icons.jsx"></script>
    <script type="text/babel" src="studio.jsx"></script>

    <script type="text/babel" data-presets="env,react">
      ReactDOM.createRoot(document.getElementById("root")).render(
        <StudioPage />,
      );
    </script>
  </body>
</html>
