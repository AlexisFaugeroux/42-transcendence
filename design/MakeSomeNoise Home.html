<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MakeSomeNoise — Home</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="design-system/colors_and_type.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--color-void); color: var(--fg1); }
  *, *::before, *::after { box-sizing: border-box; }
  button { font: inherit; }
  .msn-artboard-bg { background: var(--color-void); }
</style>
</head>
<body>
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Data and components -->
<script src="data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="home-variant-a.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function App() {
    return (
      <DesignCanvas
        title="MakeSomeNoise — Home page"
        subtitle="openDAW design system · 1440×960 desktop"
      >
        <DCSection id="home" title="Home">
          <DCArtboard id="home" label="Home — sidebar nav, orange-led" width={1440} height={960}>
            <div className="msn-artboard-bg" style={{ width: "100%", height: "100%" }}>
              <HomeVariantA onlineLayout="list" />
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
