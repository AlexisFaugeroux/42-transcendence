<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Menu</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        padding: 14px;
        background: var(--bg-app);
        color: var(--fg1);
        display: flex;
        gap: 14px;
      }
      .menu {
        background: var(--bg-elevated);
        border: 1px solid var(--line-soft);
        border-radius: 4px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        padding: 4px 0;
        min-width: 180px;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 10px;
        font-size: 11px;
        color: var(--fg1);
        cursor: pointer;
      }
      .item .check {
        width: 10px;
        opacity: 0;
        color: var(--fg2);
      }
      .item.checked .check {
        opacity: 1;
      }
      .item .key {
        margin-left: auto;
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--fg3);
        letter-spacing: 0.05em;
      }
      .item.hover {
        background: var(--color-active);
        color: white;
      }
      .item.hover .key,
      .item.hover .check {
        color: rgba(255, 255, 255, 0.8);
        opacity: 1;
      }
      .sep {
        height: 1px;
        background: var(--line-soft);
        margin: 4px 0;
      }
      .group {
        font-size: 9px;
        color: var(--fg3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 6px 10px 2px;
      }
    </style>
  </head>
  <body>
    <div class="menu">
      <div class="group">File</div>
      <div class="item">
        <span class="check">✓</span>New Project<span class="key">⌘N</span>
      </div>
      <div class="item hover">
        <span class="check">✓</span>Open…<span class="key">⌘O</span>
      </div>
      <div class="item checked">
        <span class="check">✓</span>Auto-Save<span class="key"></span>
      </div>
      <div class="sep"></div>
      <div class="item">
        <span class="check">✓</span>Export<span class="key">⌘E</span>
      </div>
      <div class="item">
        <span class="check">✓</span>Publish to Music…<span class="key"></span>
      </div>
    </div>
    <div class="menu" style="min-width: 140px">
      <div class="item">
        <span class="check">✓</span>Cut<span class="key">⌘X</span>
      </div>
      <div class="item">
        <span class="check">✓</span>Copy<span class="key">⌘C</span>
      </div>
      <div class="item">
        <span class="check">✓</span>Paste<span class="key">⌘V</span>
      </div>
    </div>
  </body>
</html>
