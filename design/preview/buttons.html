<!doctype html>
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 14px; background: var(--bg-app); color: var(--fg1); display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > .lbl { font-family: var(--font-mono); font-size: 9px; color: var(--fg3); flex: 0 0 110px; text-transform: uppercase; letter-spacing: 0.04em; }
  .btn { font-family: var(--font-display); font-weight: 300; font-size: 11px; height: 22px; padding: 0 10px; border-radius: 3px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; background: transparent; color: var(--fg2); border: 0.5px solid transparent; line-height: 1; }
  .btn:hover { color: var(--fg1); }
  .btn.framed { border-color: currentColor; }
  .btn.framed:hover { box-shadow: 0 0 3px -1px currentColor; }
  .btn.active { color: var(--color-orange); border-color: currentColor; box-shadow: 0 0 3px -1px currentColor; background: color-mix(in srgb, var(--color-orange) 5%, transparent); }
  .btn.commit { color: white; background: var(--color-active); border-color: transparent; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 400; }
  .btn.danger { color: var(--color-red); border-color: currentColor; }
  .btn.danger:hover { background: color-mix(in srgb, var(--color-red) 8%, transparent); }
  .ico { width: 12px; height: 12px; fill: currentColor; }
</style></head>
<body>
  <div class="row"><div class="lbl">Default</div>
    <button class="btn">Cancel</button>
    <button class="btn framed">Browse</button>
    <button class="btn framed">Add Track</button>
  </div>
  <div class="row"><div class="lbl">Active</div>
    <button class="btn active">
      <svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5"/></svg>
      Record
    </button>
    <button class="btn active" style="color: var(--color-yellow)">SOLO</button>
    <button class="btn active" style="color: var(--color-red)">M</button>
  </div>
  <div class="row"><div class="lbl">Commit</div>
    <button class="btn commit">APPLY</button>
    <button class="btn commit" style="background: var(--color-purple)">PUBLISH</button>
    <button class="btn danger">Delete</button>
  </div>
</body></html>
