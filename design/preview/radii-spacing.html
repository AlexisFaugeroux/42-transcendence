<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Radii & Spacing</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        padding: 16px;
        background: var(--bg-app);
        color: var(--fg1);
        display: flex;
        gap: 30px;
        align-items: flex-start;
      }
      .group {
        flex: 1;
      }
      .label {
        color: var(--fg3);
        font-family: var(--font-mono);
        font-size: 9px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .radii {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .radii .box {
        width: 44px;
        height: 44px;
        background: var(--bg-card);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 4px;
        font-size: 9px;
        color: var(--fg2);
        font-family: var(--font-mono);
      }
      .spacing {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .spacing .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .spacing .bar {
        background: var(--color-orange);
        height: 8px;
        border-radius: 1px;
      }
      .spacing .v {
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--fg2);
      }
    </style>
  </head>
  <body>
    <div class="group">
      <div class="label">Radii</div>
      <div class="radii">
        <div class="box" style="border-radius: 2px">2px</div>
        <div class="box" style="border-radius: 4px">4px</div>
        <div class="box" style="border-radius: 6px">6px</div>
        <div class="box" style="border-radius: 8px">8px</div>
        <div class="box" style="border-radius: 50%">∞</div>
      </div>
    </div>
    <div class="group">
      <div class="label">Spacing (em-based)</div>
      <div class="spacing">
        <div class="row">
          <div class="bar" style="width: 4px"></div>
          <div class="v">.25em</div>
        </div>
        <div class="row">
          <div class="bar" style="width: 8px"></div>
          <div class="v">.5em</div>
        </div>
        <div class="row">
          <div class="bar" style="width: 12px"></div>
          <div class="v">.75em</div>
        </div>
        <div class="row">
          <div class="bar" style="width: 16px"></div>
          <div class="v">1em</div>
        </div>
        <div class="row">
          <div class="bar" style="width: 24px"></div>
          <div class="v">1.5em</div>
        </div>
      </div>
    </div>
  </body>
</html>
