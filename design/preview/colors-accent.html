<!doctype html>
<html><head><meta charset="utf-8"><title>Hue Accents</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .swatch { aspect-ratio: 1.4; border-radius: 4px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; color: rgba(0,0,0,0.85); font-weight: 400; font-size: 10px; }
  .swatch .name { font-weight: 400; font-size: 11px; }
  .swatch .role { opacity: 0.7; font-size: 9px; line-height: 1.3; }
</style></head>
<body>
  <div class="grid">
    <div class="swatch" style="background: var(--color-blue)"><div class="name">blue</div><div class="role">primary / info</div></div>
    <div class="swatch" style="background: var(--color-green)"><div class="name">green</div><div class="role">save / pan / OK</div></div>
    <div class="swatch" style="background: var(--color-orange)"><div class="name">orange</div><div class="role">region / metro</div></div>
    <div class="swatch" style="background: var(--color-yellow)"><div class="name">yellow</div><div class="role">volume / solo</div></div>
    <div class="swatch" style="background: var(--color-red)"><div class="name">red</div><div class="role">record / mute</div></div>
    <div class="swatch" style="background: var(--color-purple)"><div class="name">purple</div><div class="role">publish / apply</div></div>
    <div class="swatch" style="background: var(--color-cyan)"><div class="name">cyan</div><div class="role">accent</div></div>
  </div>
</body></html>
