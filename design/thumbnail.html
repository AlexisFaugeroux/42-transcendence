<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; }
  .main {
    flex: 1;
    background: var(--color-orange);
    display: flex; align-items: center; justify-content: center;
    padding: 6%;
  }
  .mark {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 150px;
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: rgba(0,0,0,0.85);
    text-align: left;
  }
  .mark .dim { font-weight: 300; }
  .strip { width: 22%; display: flex; flex-direction: column; }
  .strip > div { flex: 1; }
</style>
</head>
<body>
  <div class="main">
    <div class="mark"><span class="dim">make</span>some<br/>noise<span style="color:var(--color-void)">.</span></div>
  </div>
  <div class="strip">
    <div style="background: var(--color-yellow)"></div>
    <div style="background: var(--color-green)"></div>
    <div style="background: var(--color-blue)"></div>
    <div style="background: var(--color-red)"></div>
  </div>
</body>
</html>
