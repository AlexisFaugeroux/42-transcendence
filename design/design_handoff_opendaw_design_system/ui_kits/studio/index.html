<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>openDAW Studio — UI Kit</title>
    <link rel="stylesheet" href="../../colors_and_type.css" />
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg-app);
        color: var(--fg1);
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
      }
      button {
        font: inherit;
      }
      h1,
      h2,
      h3,
      h4,
      h5 {
        text-wrap: pretty;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="primitives.jsx"></script>
    <script type="text/babel" src="Header.jsx"></script>
    <script type="text/babel" src="Footer.jsx"></script>
    <script type="text/babel" src="Dashboard.jsx"></script>
    <script type="text/babel" src="Browser.jsx"></script>
    <script type="text/babel" src="Arrangement.jsx"></script>
    <script type="text/babel" src="Mixer.jsx"></script>
    <script type="text/babel" src="Workspace.jsx"></script>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [screen, setScreen] = useState("dashboard");
        const [project, setProject] = useState(null);
        const [transport, setTransport] = useState("stop");

        return (
          <div
            data-screen-label={
              screen === "dashboard"
                ? "01 Dashboard"
                : screen === "mixer"
                  ? "03 Mixer"
                  : "02 Arrangement"
            }
            style={{ height: "100%", display: "flex", flexDirection: "column" }}
          >
            <Header
              screen={screen}
              onScreenChange={setScreen}
              onBrandClick={() => setScreen("dashboard")}
              transport={transport}
              onTransportChange={(t) =>
                setTransport(t === transport ? "stop" : t)
              }
            />
            {screen === "dashboard" ? (
              <Dashboard
                onOpenProject={(name) => {
                  setProject(name);
                  setScreen("default");
                }}
              />
            ) : (
              <Workspace screen={screen} />
            )}
            <Footer project={project} />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("app")).render(<App />);
    </script>
  </body>
</html>
