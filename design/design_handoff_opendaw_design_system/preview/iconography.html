<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iconography</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        padding: 14px;
        background: var(--bg-app);
        color: var(--fg1);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 10px 12px;
      }
      .ico {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 9px;
        color: var(--fg3);
      }
      .ico svg {
        width: 18px;
        height: 18px;
        color: var(--fg1);
      }
      .ico.accent svg {
        color: var(--c, var(--color-orange));
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="ico">
        <svg viewBox="0 1 14 14" fill="currentColor">
          <path
            d="M3 3.732a1.5 1.5 0 0 1 2.305-1.265l6.706 4.267a1.5 1.5 0 0 1 0 2.531l-6.706 4.268A1.5 1.5 0 0 1 3 12.267z"
          /></svg
        >play
      </div>
      <div class="ico">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <rect x="2" y="2" width="12" height="12" rx="2" /></svg
        >stop
      </div>
      <div class="ico accent" style="--c: var(--color-red)">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <circle cx="8" cy="8" r="6.5" /></svg
        >record
      </div>
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 22C6.48 22 2 17.52 2 12S6.48 2 12 2s10 4.48 10 10-4.48 10-10 10zm-1-11H7v2h4v4h2v-4h4v-2h-4V7h-2v4z"
          /></svg
        >add
      </div>
      <div class="ico">
        <svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="1.5"
        >
          <circle cx="8" cy="2.5" r=".75" fill="currentColor" />
          <circle cx="8" cy="8" r=".75" fill="currentColor" />
          <circle cx="8" cy="13.5" r=".75" fill="currentColor" /></svg
        >menu
      </div>
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 22C6.48 22 2 17.52 2 12S6.48 2 12 2s10 4.48 10 10-4.48 10-10 10zm0-2c4.42 0 8-3.58 8-8s-3.58-8-8-8-8 3.58-8 8 3.58 8 8 8zm-1.41-8L8 9.41 9.41 8 12 10.59 14.59 8 16 9.41 13.41 12 16 14.59 14.59 16 12 13.41 9.41 16 8 14.59 10.59 12z"
          /></svg
        >close
      </div>
      <div class="ico accent" style="--c: var(--color-red)">
        <svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
        >
          <path
            d="M3,14L3,2.735C3,2.276 3.307,1.874 3.75,1.753C4.192,1.633 4.661,1.824 4.894,2.219C5.66,3.522 6.508,4.963 7.123,6.01C7.306,6.32 7.64,6.511 8,6.511C8.36,6.511 8.694,6.32 8.877,6.01C9.492,4.963 10.34,3.522 11.106,2.219C11.339,1.824 11.808,1.633 12.25,1.753C12.692,1.874 13,2.276 13,2.735L13,14"
          /></svg
        >mute
      </div>
      <div class="ico accent" style="--c: var(--color-yellow)">
        <svg
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
        >
          <circle cx="8" cy="8" r="5" />
          <path d="M5 8 L8 8 M8 5 L8 11" /></svg
        >solo
      </div>
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" />
          <circle cx="12" cy="6" r="2" />
          <circle cx="6" cy="14" r="2" />
          <circle cx="18" cy="14" r="2" /></svg
        >auto
      </div>
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M8,3L8,21C8,22.1 7.1,23 6,23L3,23C1.9,23 1,22.1 1,21L1,3C1,1.9 1.9,1 3,1L6,1C7.1,1 8,1.9 8,3Z"
          />
          <path
            d="M23,3L23,11C23,12.1 22.1,13 21,13L12,13C10.9,13 10,12.1 10,11L10,3C10,1.9 10.9,1 12,1L21,1C22.1,1 23,1.9 23,3ZM22,3C22,2.4 21.5,2 21,2L12,2C11.4,2 11,2.4 11,3L11,11C11,11.5 11.4,12 12,12L21,12C21.5,12 22,11.5 22,11L22,3Z"
          />
          <path
            d="M23,17L23,21C23,22.1 22.1,23 21,23L12,23C10.9,23 10,22.1 10,21L10,17C10,15.9 10.9,15 12,15L21,15C22.1,15 23,15.9 23,17Z"
          /></svg
        >brand
      </div>
    </div>
  </body>
</html>
