<!doctype html>
<html><head><meta charset="utf-8"><title>Card / Demo Project Tile</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { padding: 14px; background: var(--bg-app); display: flex; gap: 12px; }
  .tile { width: 150px; background: var(--bg-card); border-radius: 4px; overflow: hidden; cursor: pointer; }
  .tile:hover { background: var(--bg-elevated); }
  .cover { aspect-ratio: 1; background: linear-gradient(135deg, hsl(280,40%,18%), hsl(210,50%,14%)); position: relative; }
  .cover.b { background: linear-gradient(135deg, hsl(25,45%,18%), hsl(8,40%,14%)); }
  .cover.c { background: linear-gradient(135deg, hsl(140,30%,16%), hsl(197,30%,10%)); }
  .cover .play { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; color: var(--fg1); }
  .meta { padding: 8px 10px; }
  .title { font-size: 11px; color: var(--fg1); margin-bottom: 1px; }
  .artist { font-size: 10px; color: var(--fg3); }
</style></head>
<body>
  <div class="tile">
    <div class="cover">
      <div class="play"><svg width="9" height="9" viewBox="0 1 14 14" fill="currentColor"><path d="M3 3.732a1.5 1.5 0 0 1 2.305-1.265l6.706 4.267a1.5 1.5 0 0 1 0 2.531l-6.706 4.268A1.5 1.5 0 0 1 3 12.267z"/></svg></div>
    </div>
    <div class="meta"><div class="title">Liquid Drum</div><div class="artist">andre michelle</div></div>
  </div>
  <div class="tile">
    <div class="cover b"><div class="play"><svg width="9" height="9" viewBox="0 1 14 14" fill="currentColor"><path d="M3 3.732a1.5 1.5 0 0 1 2.305-1.265l6.706 4.267a1.5 1.5 0 0 1 0 2.531l-6.706 4.268A1.5 1.5 0 0 1 3 12.267z"/></svg></div></div>
    <div class="meta"><div class="title">Tape Saturator</div><div class="artist">andre michelle</div></div>
  </div>
  <div class="tile">
    <div class="cover c"><div class="play"><svg width="9" height="9" viewBox="0 1 14 14" fill="currentColor"><path d="M3 3.732a1.5 1.5 0 0 1 2.305-1.265l6.706 4.267a1.5 1.5 0 0 1 0 2.531l-6.706 4.268A1.5 1.5 0 0 1 3 12.267z"/></svg></div></div>
    <div class="meta"><div class="title">First Steps</div><div class="artist">tutorial</div></div>
  </div>
</body></html>
