<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shadows & Glows</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        padding: 18px;
        background: var(--bg-app);
        color: var(--fg1);
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: center;
      }
      .tile {
        width: 110px;
        height: 56px;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-mono);
        font-size: 9px;
        color: var(--fg2);
        gap: 4px;
      }
      .frame {
        background: var(--bg-card);
        color: var(--color-orange);
        border: 0.5px solid currentColor;
        box-shadow: 0 0 3px -1px currentColor;
      }
      .frame .lbl {
        color: var(--fg2);
      }
      .glow-blue {
        background: var(--bg-card);
        border: 0.5px solid var(--color-blue);
        box-shadow: 0 0 6px 0 var(--color-blue);
        color: var(--color-blue);
      }
      .floating {
        background: var(--bg-elevated);
        border: 1px solid var(--line-soft);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        color: var(--fg1);
      }
      .hairline {
        background: var(--bg-card);
        border: 1px solid var(--line-faint);
        color: var(--fg2);
      }
    </style>
  </head>
  <body>
    <div class="tile frame">
      <div>0 0 3px -1px</div>
      <div class="lbl">accent frame</div>
    </div>
    <div class="tile glow-blue">
      <div>0 0 6px 0</div>
      <div>active glow</div>
    </div>
    <div class="tile floating">
      <div>0 4 16 / 50%</div>
      <div>floating</div>
    </div>
    <div class="tile hairline">
      <div>1px white/04</div>
      <div>hairline</div>
    </div>
  </body>
</html>
