<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg-panel-2);
        color: var(--fg1);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      #root {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 16px;
        color: var(--fg1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script src="../_ds_bundle.js"></script>
    <script>
      const { Icon } = window.OpenDAWDesignSystem_019dce;
      const h = React.createElement;
      const names = [
        "msn",
        "record",
        "produce",
        "mix",
        "search",
        "bell",
        "plus",
        "play",
        "heart",
        "chat",
        "folder",
        "home",
        "user",
        "users",
        "list",
        "grid",
        "settings",
        "music",
        "waveform",
        "download",
        "arrowR",
        "arrowL",
        "triangle",
      ];
      const colors = [
        "var(--color-orange)",
        "var(--color-red)",
        "var(--color-blue)",
        "var(--color-green)",
        "var(--color-yellow)",
        "var(--color-cyan)",
        "var(--color-purple)",
        "var(--fg1)",
      ];
      ReactDOM.createRoot(document.getElementById("root")).render(
        names.map((n, i) =>
          h(Icon, {
            key: n,
            name: n,
            size: "22px",
            color: colors[i % colors.length],
            title: n,
          }),
        ),
      );
    </script>
  </body>
</html>
