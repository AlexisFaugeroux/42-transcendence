services:
  db:
    image: postgres:18-alpine
    env_file:
      - "apps/back/.env.prod"
    restart: always
    volumes:
      - db_data:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - transcendence_net

  nginx-media:
    image: nginx:1.30.3-alpine
    restart: always
    expose:
      - "80"
    volumes:
      - ./infra/nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
    networks:
      - transcendence_net

  back:
    profiles:
      - "prod"
    build: { context: ., dockerfile: apps/back/Dockerfile }
    env_file:
      - "apps/back/.env.prod"
    restart: always
    depends_on:
      - "db"
      - "nginx-media"
    volumes:
      - media_data:/var/www/media:rw
    networks:
      - transcendence_net

  front:
    profiles:
      - "prod"
    build: { context: ., dockerfile: apps/front/Dockerfile }
    restart: always
    networks:
      - transcendence_net

  studio:
    profiles:
      - "prod"
    build: { context: ., dockerfile: apps/studio/Dockerfile }
    restart: always
    networks:
      - transcendence_net

  reverse-proxy-seeder:
    profies:
      - "prod"
    image: alpine:latest
    command: >
      sh -c "apk add --no-cache openssl &&
             if [ ! -f /certs/cert.pem ]; then
               openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                 -keyout /certs/key.pem \
                 -out /certs/cert.pem \
                 -subj '/C=FR/ST=Ile-de-France/L=Paris/O=42/OU=makesomenoise/CN=localhost';
             fi"
    volumes:
      - shared_certs:/certs

  reverse-proxy:
    profiles:
      - "prod"
    image: nginx:1.30.3-alpine
    restart: always
    ports:
      - 8443:443
    depends_on:
      - front
      - studio
      - back
      - nginx-media
      - reverse-proxy-seeder
    volumes:
      - ./infra/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - shared_certs:/etc/nginx/certs:ro
    networks:
      - transcendence_net

networks:
  transcendence_net:
    name: transcendence_net

volumes:
  media_data:
    name: media_data
  db_data:
    name: db_data
  shared_certs:
    name: shared_certs
