services:
  db:
    image: postgres:18-alpine
    env_file:
      - "apps/back/.env"
    restart: always
    volumes:
      - db_data:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - transcendence_net

  nginx-media:
    image: nginx:1.30.3-alpine
    restart: always
    expose:
      - "80"
    volumes:
      - ./infra/nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
    networks:
      - transcendence_net

  back:
    profiles:
      - "prod"
    build: { context: ., dockerfile: apps/back/Dockerfile }
    env_file:
      - "apps/back/.env.prod"
    restart: always
    depends_on:
      - "db"
      - "nginx-media"
    volumes:
      - media_data:/var/www/media:rw
    networks:
      - transcendence_net

  front:
    profiles:
      - "prod"
    build: { context: ., dockerfile: apps/front/Dockerfile }
    restart: always
    networks:
      - transcendence_net

  studio:
    profiles:
      - "prod"
    build: { context: ., dockerfile: apps/studio/Dockerfile }
    restart: always
    networks:
      - transcendence_net

  reverse-proxy:
    profiles:
      - "prod"
    image: nginx:1.30.3-alpine
    restart: always
    ports:
      - 8080:80
      - 8443:443
    depends_on:
      - front
      - studio
      - back
      - nginx-media
    volumes:
      - ./infra/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - transcendence_net

networks:
  transcendence_net:
    name: transcendence_net

volumes:
  media_data:
    name: media_data
  db_data:
    name: db_data
