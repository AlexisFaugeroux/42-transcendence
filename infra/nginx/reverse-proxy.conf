server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate       /etc/nginx/certs/cert.pem;
  ssl_certificate_key   /etc/nginx/certs/key.pem;

  resolver 127.0.0.11 valid=10s; # DNS interne Docker -> nginx demarre meme si back absent

  location /studio/ {
    set $studio_upstream studio:80;
    proxy_pass http://$studio_upstream;
  }
  
  location /samples/ {
    set $media_upstream nginx-media:80;
    proxy_pass http://$media_upstream;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  location /tracks/ {
    set $media_upstream nginx-media:80;
    proxy_pass http://$media_upstream;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  location /avatars/ {
    set $media_upstream nginx-media:80;
    proxy_pass http://$media_upstream;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
  }

  location = /api/ws {
    set $back_upstream back:8080;

    proxy_pass http://$back_upstream;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    client_max_body_size 500m;
    set $back_upstream back:8080;
    proxy_pass http://$back_upstream;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    set $front_upstream front:80;
    proxy_pass http://$front_upstream;
  }
}
