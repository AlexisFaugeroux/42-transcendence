server {
  listen 80;
  server_name _; # catches all requests (whatever the domain) -> default server

  location /samples/ {
    auth_request /auth/check-access;
    root /var/www/media;

    # Headers de la réponse audio finale
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
    add_header Vary "Origin" always;
  }

  location /tracks/ {
    auth_request /auth/check-access;
    root /var/www/media;

    # Headers de la réponse audio finale
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
    add_header Vary "Origin" always;
  }

  location /avatars/ {
    root /var/www/media;

    add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range" always;
    add_header Vary "Origin" always;
  }

  location = /auth/check-access {
    internal;  #only accessible by internal nginx server requests (like auth_request)

    proxy_pass http://back:8080/api/auth/check-access;
    
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    proxy_set_header X-Original-URI $request_uri; #uri from the front : here qre the queries
    proxy_set_header X-Original-Method $request_method; #method comming from the front ( GET )
    
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
  }
}
